name: dco

on:
  pull_request:
  push:
    branches: [main]

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by and no AI trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if git cat-file -e "$BASE" 2>/dev/null; then range="$BASE..$HEAD"; else range="$HEAD"; fi
          bad=0
          for c in $(git rev-list --no-merges "$range"); do
            msg=$(git log -1 --format=%B "$c")
            if ! printf '%s\n' "$msg" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
            if printf '%s\n' "$msg" | grep -Eiq '^Co-Authored-By:.*(claude|anthropic)|^Claude-Session:|claude\.ai/code/session'; then
              echo "AI trailer or session link: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          exit $bad
